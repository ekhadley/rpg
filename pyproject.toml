[project]
name = "lm_rpg"
version = "0.1.0"
description = "LLM-powered text RPG with pluggable game systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.1",
    "flask-socketio>=5.5.1",
    "requests>=2.32.5",
]

typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
